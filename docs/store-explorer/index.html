<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive browser for HAMLET store data.">
  <title>HAMLET Store Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div>
      <p class="eyebrow">HAMLET / Store Explorer</p>
      <h1>Proteomics records, inspectable.</h1>
    </div>
    <p id="record-count" class="record-count">Loading store index...</p>
  </header>
  <main class="workspace">
    <aside class="catalog" aria-label="PXD catalog">
      <label for="pxd-filter">Find a PXD</label>
      <input id="pxd-filter" type="search" placeholder="PXD005463" autocomplete="off">
      <label for="version-filter">HAMLET version</label>
      <select id="version-filter">
        <option value="">All versions</option>
      </select>
      <div id="pxd-list" class="pxd-list"></div>
    </aside>
    <section id="detail" class="detail" aria-live="polite">
      <div class="empty-state">Choose a PXD to inspect its stored outputs.</div>
    </section>
  </main>
  <template id="json-template">
    <details class="json-viewer">
      <summary></summary>
      <pre></pre>
    </details>
  </template>
  <script src="app.js"></script>
</body>
</html>
