name: Deploy Store Explorer

on:
  push:
    branches: [main]
    paths:
      - docs/store-explorer/**
      - store/**
      - src/job_scripts/build_store_explorer.py
      - .github/workflows/deploy-store-explorer.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static store bundle
        run: python src/job_scripts/build_store_explorer.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/store-explorer
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4